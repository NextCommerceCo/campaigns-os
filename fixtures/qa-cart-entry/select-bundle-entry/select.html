<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select your bundle</title>
<style>body{font-family:sans-serif;margin:24px} .card{border:1px solid #ccc;padding:12px;margin:8px 0} .card.next-selected{border-color:#000} iframe{width:200px;height:32px;border:1px solid #ccc}</style>
</head>
<body data-fixture-reset-cart>
<main>
  <h1>Select your bundle</h1>
  <section data-next-bundle-selector data-next-selection-mode="swap" data-next-selector-id="main">
    <div class="card next-selected" data-next-bundle-card data-next-package-id="1">1 bottle</div>
    <div class="card" data-next-bundle-card data-next-package-id="2">3 bottles</div>
  </section>
  <a href="/x/checkout/?forcePackageId=" style="display:none">decoy with an empty forcePackageId</a>
  <button data-next-action="checkout" data-next-url="/x/checkout/">Checkout now</button>
</main>
<script src="/sdk-shim.js"></script>
</body>
</html>
