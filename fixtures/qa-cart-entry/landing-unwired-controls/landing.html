  <h1>Landing (controls the SDK never wires)</h1>

  <button type="button" data-next-add-to-cart data-next-package-id="1" data-next-url="/x/checkout/">Add to cart (bare attribute)</button>
  <button type="button" data-next-checkout-action="add-to-cart" data-next-package-id="1" data-next-url="/x/checkout/">Add to cart (checkout-action attribute)</button>
</main>
