<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example Campaign — Offer 2</title>
  <meta name="next-page-type" content="upsell">
  <meta name="next-upsell-accept-url" content="/example-campaign/receipt/">
  <meta name="next-upsell-decline-url" content="/example-campaign/receipt/">
  <script src="https://cdn.example.test/campaign-cart@v0.4.27/dist/loader.js"></script>
</head>
<body>
  <!--
    The #270 regression. Two bundle selectors, only one of them scoped.

    The first is display-only and hidden, and carries neither
    data-next-upsell-context nor data-next-selection-mode="select" — so it is a
    LIVE CART selector in the default swap mode. The SDK's init-time cart sync
    picks its default card and applies it, so merely loading this page adds
    package 33 to the shopper's cart. Being hidden changes nothing.
  -->
  <div data-next-bundle-selector data-next-selector-id="upsell-bundle-1x" style="display:none">
    <div role="button" data-next-bundle-card data-next-bundle-id="upsell-2-1x"
         data-next-bundle-items='[{"packageId":33,"quantity":1}]'
         data-next-selected="true"></div>
  </div>

  <div class="upsell-wrapper" data-next-upsell="offer">
    <div data-next-bundle-selector data-next-upsell-context data-next-selector-id="upsell-bundle">
      <div role="button" data-next-bundle-card data-next-bundle-id="upsell-2-2x"
           data-next-bundle-items='[{"packageId":33,"quantity":2}]'
           data-next-selected="true"></div>
    </div>
    <button data-next-upsell-action="accept">Yes, add it</button>
  </div>
</body>
</html>
