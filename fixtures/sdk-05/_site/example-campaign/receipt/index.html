<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>sdk 0.5 receipt</title>
    <meta name="next-page-type" content="receipt">
    <script type="module" src="https://cdn.jsdelivr.net/gh/NextCommerceCo/campaign-cart@v0.5.0/dist/loader.js" data-campaign="pk_example_sdk05" data-funnel="example"></script>
    <style>html:not([data-next-ready]) [data-next-query] { visibility: hidden; }</style>
  </head>
  <body>
    <h1>Thanks, <span data-next-query="order.user.first_name"></span></h1>
    <div data-next-each="order.lines">
      <template>
        <div><span data-next-query="product_title"></span> × <span data-next-query="quantity"></span></div>
      </template>
    </div>
    <p>Total <span data-next-query="order.total"></span></p>
  </body>
</html>
