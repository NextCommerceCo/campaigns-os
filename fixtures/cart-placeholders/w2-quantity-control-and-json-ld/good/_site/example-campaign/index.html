<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic cart placeholder fixture</title>
<script src="https://cdn.example.invalid/campaign-cart@v0.4.38/dist/loader.js"></script>
</head>
<body>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"Synthetic product","description":"{subtotal} {item.name}"}</script>
<div data-next-quantity="decrease" data-package-id="2" role="button">-{step}</div>
<div data-next-quantity="increase" data-package-id="2" role="button">+{step} (now {quantity})</div>
</body>
</html>
