<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic cart placeholder fixture</title>
<script src="https://cdn.example.invalid/campaign-cart@0.4.38/dist/loader.js"></script>
</head>
<body>
<template id="synthetic-cart-row">
  <div class="cart-row"><span>{item.name}</span> <span>{item.price}</span></div>
</template>
<div data-next-cart-items>
  <div class="cart-row"><span>{item.name}</span> x <span>{item.quantity}</span></div>
</div>
</body>
</html>
