<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic hero source</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #141414; background: #ffffff; }
  header { box-sizing: border-box; height: 120px; padding-top: 40px; }
  h1 { margin: 0 40px; width: 600px; height: 40px; font-size: 32px; line-height: 40px; }
  .hero { position: relative; width: 640px; }
  .hero img { display: block; width: 640px; height: 495px; }
  .badges { display: flex; gap: 20px; padding-left: 20px; position: absolute; left: 0; top: 427px; }
  .badges span { display: block; width: 100px; height: 40px; font-size: 16px; line-height: 40px; }
  main p { margin: 0 40px; width: 600px; height: 24px; font-size: 16px; line-height: 24px; }
  main p.after { margin-top: 4px; }
  main p.footer { margin-top: 57px; }
</style></head>
<body>
  <header><h1>Synthetic headline</h1></header>
  <main>
    <section class="hero">
      <img src="parity-art.svg" alt="">
      <div class="badges"><span>Badge one</span><span>Badge two</span><span>Badge three</span></div>
    </section>
    <p class="after">Body copy after hero</p>
    <p class="footer">Synthetic footer</p>
  </main>
</body>
</html>
