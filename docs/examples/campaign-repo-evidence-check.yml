# Copy to .github/workflows/evidence-check.yml in a campaign Page Kit repo.
# Keep reviewed, exact project-local tool versions in package.json/package-lock.json.
name: Campaign evidence check
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: campaign-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.doctor.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the campaign site
        run: |
          npx --no-install campaign-build --json > "$RUNNER_TEMP/page-kit-build-summary.json"
        env:
          # Match the environment recorded on the Assembly Report. The
          # documented local-proof flow records a development render.
          CPK_ENV: development
      - name: Inspect evidence debt
        id: doctor
        continue-on-error: true
        # Replace the packet path with the committed packet in this repo.
        run: |
          set +e
          # Only formatted stdout belongs in the PR comment; stderr stays in the job log.
          npx --no-install campaigns-os doctor --packet ./campaign-runtime.build.json --ci --no-live-refs > "$RUNNER_TEMP/campaign-evidence.md"
          status=$?
          status=${status:-1}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/campaign-evidence.md"
          exit "$status"
      - name: Prepare fallback report
        if: ${{ !cancelled() && steps.doctor.outputs.exit_code == '' }}
        run: |
          printf '%s\n' 'Campaign build failed; evidence not evaluated. See the job log.' > "$RUNNER_TEMP/campaign-evidence.md"
      - name: Upload evidence report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: campaign-evidence-report
          path: ${{ runner.temp }}/campaign-evidence.md
          if-no-files-found: error

  comment:
    needs: evidence
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download evidence report
        uses: actions/download-artifact@v4
        # A failed evidence job may have been unable to upload a report.
        continue-on-error: true
        with:
          name: campaign-evidence-report
          path: ${{ runner.temp }}/campaign-evidence-report
      - name: Post or update the evidence comment
        if: ${{ !cancelled() }}
        # Fork PR tokens may be read-only. Keep the report in the job log and
        # let only the explicit enforcement step fail on evidence findings.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DOCTOR_EXIT_CODE: ${{ needs.evidence.outputs.exit_code }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const marker = '<!-- campaign-evidence-check -->';
            let report = 'Campaign build failed; evidence not evaluated. See the job log.';
            if (process.env.DOCTOR_EXIT_CODE) {
              report = 'Campaign evidence could not be evaluated. See the job log.';
              try {
                report = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'campaign-evidence-report', 'campaign-evidence.md'), 'utf8') || report;
              } catch (error) {
                if (error.code !== 'ENOENT') throw error;
              }
            }
            const body = `${marker}\n${report}`;
            const params = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
      - name: Optionally enforce evidence debt
        if: ${{ !cancelled() && vars.CAMPAIGNS_OS_EVIDENCE_CHECK == 'fail' && needs.evidence.outputs.exit_code != '' && needs.evidence.outputs.exit_code != '0' }}
        run: exit 1
