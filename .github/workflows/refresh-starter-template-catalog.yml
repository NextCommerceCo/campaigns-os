name: Refresh Starter Template Catalog

# Two supported operating modes:
# - With CATALOG_REFRESH_TOKEN (fine-grained contents + pull requests: write),
#   the workflow pushes a stable bot branch and opens/updates its PR; PAT-authored
#   events trigger normal PR CI.
# - Without it, the repository-scoped token still pushes the validated branch,
#   then opens or updates one durable issue with a one-click human PR link.
#   This repo forbids Actions-created PRs, so the fallback is expected behavior.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "campaign-cart-starter-templates branch, tag, or SHA to snapshot"
        required: false
        default: "main"
  repository_dispatch:
    types: [starter-template-catalog-updated]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-starter-template-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CATALOG_REFRESH_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve source ref
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          source_ref="$INPUT_SOURCE_REF"
          source_sha=""
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            source_ref="$DISPATCH_SOURCE_REF"
            source_sha="$DISPATCH_SOURCE_SHA"
          fi
          if [ -z "$source_ref" ]; then
            source_ref="main"
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Refresh vendored catalog snapshot
        env:
          STARTER_TEMPLATES_TOKEN: ${{ secrets.STARTER_TEMPLATES_READ_TOKEN || github.token }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          args=(--source-ref "$SOURCE_REF")
          if [ -n "$SOURCE_SHA" ]; then
            args+=(--synced-from-sha "$SOURCE_SHA")
          fi
          node scripts/refresh-starter-template-catalog.mjs "${args[@]}"

      - name: Validate refreshed snapshot
        run: npm run check

      - name: Open refresh PR
        env:
          GH_TOKEN: ${{ secrets.CATALOG_REFRESH_TOKEN || github.token }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
          PR_TOKEN_CONFIGURED: ${{ secrets.CATALOG_REFRESH_TOKEN != '' }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_REPO: NextCommerceCo/campaign-cart-starter-templates
        run: |
          if git diff --quiet; then
            echo "Starter template catalog snapshot is already current."
            exit 0
          fi

          branch="automation/refresh-starter-template-catalog"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add contracts/commerce-surface-catalog.json contracts/fixtures/campaign-specs
          git commit -m "Refresh starter template catalog snapshot"
          # This branch is workflow-owned and concurrency serializes its writers.
          git push --force origin "$branch"

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Refresh PR #${existing_pr} already open; branch updated."
            if [ "$PR_TOKEN_CONFIGURED" = "true" ]; then
              exit 0
            fi
          fi

          source_label="${SOURCE_REPO}@${SOURCE_REF}"
          if [ -n "$SOURCE_SHA" ]; then
            source_label="${source_label} (${SOURCE_SHA})"
          fi
          body="Refreshes the vendored Campaigns OS starter-template catalog snapshot from \`${source_label}\`.

          Validation:
          - \`npm run check\`

          Triggered by: \`${GITHUB_EVENT_NAME}\`"

          if [ -z "$existing_pr" ]; then
            if gh pr create \
              --base main \
              --head "$branch" \
              --title "Refresh starter template catalog snapshot" \
              --body "$body"; then
              echo "Refresh PR opened automatically."
              exit 0
            fi
          fi

          # Expected when CATALOG_REFRESH_TOKEN is not configured: the default
          # Actions token may push the branch but repository policy forbids it
          # from opening a PR. Leave a durable issue plus a one-click PR link so
          # the refresh is actionable rather than a red or silent workflow run.
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          if [ -n "$existing_pr" ]; then
            note="The starter catalog refresh passed validation and updated PR #${existing_pr}, but a default-token push does not trigger CI. Close and reopen that PR to run checks, or configure \`CATALOG_REFRESH_TOKEN\` for automatic updates. Source: \`${source_label}\`."
          else
            note="The starter catalog refresh passed validation and the branch \`${branch}\` is ready, but Actions cannot open the PR without \`CATALOG_REFRESH_TOKEN\`. [Open the generated PR](${compare_url}) for \`${source_label}\`."
          fi
          echo "::warning title=Catalog refresh PR needs a human::${note}"
          printf '### Catalog refresh PR needs a human\n\n%s\n' "$note" >> "$GITHUB_STEP_SUMMARY"

          issue_title="Open the generated starter catalog refresh PR"
          issue_number="$(GH_TOKEN="$FALLBACK_GH_TOKEN" gh issue list --state open --search "${issue_title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue_number" ]; then
            GH_TOKEN="$FALLBACK_GH_TOKEN" gh issue comment "$issue_number" --body "$note"
            echo "Updated fallback issue #${issue_number}."
          else
            GH_TOKEN="$FALLBACK_GH_TOKEN" gh issue create --title "$issue_title" --body "$note"
          fi
