name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [types, unit, contracts, browser]
    defaults:
      run:
        working-directory: campaigns-os
    env:
      STARTER_TEMPLATES_PATH: ${{ github.workspace }}/campaign-cart-starter-templates
    steps:
      - uses: actions/checkout@v7
        with:
          path: campaigns-os
          # Full history ONLY on pull_request, where check-skill-versions diffs
          # against the base sha to require a version bump per changed skill
          # package. Pushes to main run no bump step, so they stay shallow.
          # Quoted values on purpose: Actions treats the number 0 as falsy, so
          # an unquoted `&& 0 || 1` collapses to 1 in both branches.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # Pin the templates checkout to the commit the vendored catalog snapshot was
      # built from (`_synced_from_sha`), so check-template-doctrine validates the
      # partial defaults the agent actually consumes rather than drifting live HEAD.
      # Falls back to `main` for legacy snapshots that predate provenance stamping.
      - name: Resolve templates pin from catalog provenance
        id: pin
        if: matrix.lane == 'unit' || matrix.lane == 'contracts'
        working-directory: ${{ github.workspace }}
        run: |
          sha="$(jq -r '._synced_from_sha // empty' campaigns-os/contracts/commerce-surface-catalog.json)"
          if [ -z "$sha" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "No _synced_from_sha in catalog (legacy snapshot); using main."
          elif printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
            echo "Pinning templates checkout to catalog _synced_from_sha=$sha"
          else
            echo "::error::catalog _synced_from_sha is malformed ('$sha'); expected a 40-char commit SHA. Re-run refresh:starter-catalog."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: matrix.lane == 'unit' || matrix.lane == 'contracts'
        with:
          repository: NextCommerceCo/campaign-cart-starter-templates
          ref: ${{ steps.pin.outputs.ref }}
          path: campaign-cart-starter-templates
      - uses: actions/setup-node@v7
        with:
          # The campaign-spec test suite runs as TypeScript via `node --test`
          # (native type stripping, unflagged since 23.6). The PUBLISHED package
          # is compiled to plain JS and runs on engines.node (>=20); this newer
          # toolchain version only gates running the .ts tests in CI.
          node-version: "24"
          cache: npm
          cache-dependency-path: campaigns-os/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build:spec
      - name: TypeScript tests
        if: matrix.lane == 'types'
        run: npm run check:spec
      - name: Published package
        if: matrix.lane == 'types'
        run: npm run check:pack -- --skip-prepare
      - name: Unit tests
        if: matrix.lane == 'unit'
        run: npm run check:tests
      - name: Contracts and generated artifacts
        if: matrix.lane == 'contracts'
        run: npm run check:contracts
      - name: Release gates
        if: matrix.lane == 'contracts' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node ./scripts/check-skill-versions.mjs --base "$BASE_SHA"
          node ./scripts/check-supported-surface.mjs --base "$BASE_SHA"
          node ./scripts/check-release-ledger.mjs --base "$BASE_SHA"
      - name: Install Chromium and Linux dependencies
        if: matrix.lane == 'browser'
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Required browser proof
        if: matrix.lane == 'browser'
        run: npm run check:browser
      - name: Consumer installation and browser resolution
        if: matrix.lane == 'browser'
        run: npm run check:consumer

  # Retain the existing required status name. Missing/skipped lanes cannot pass.
  check:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: All validation lanes passed
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
